[project]
name = "helios"
version = "0.1.0"
description = "Credit risk model development platform — KPMG demo asset"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "scikit-learn>=1.5",
  "pyarrow>=17",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
]

[project.optional-dependencies]
binning = ["optbinning>=0.19"]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning"]

[tool.ruff]
line-length = 100
