# CreditIQ — `docker compose up` and open http://localhost:8000
#
# One service on one port. No API key, no network access and no configuration:
# the FRED history and the supervisory scenarios are committed, and the synthetic
# panels are generated during the image build.

services:
  creditiq:
    build:
      context: .
      dockerfile: Dockerfile
    image: creditiq:latest
    container_name: creditiq
    ports:
      - "8000:8000"
    environment:
      # Optional. Only enables the live-refresh demonstration; the application is
      # fully functional without it and never writes it to disk.
      FRED_API_KEY: "${FRED_API_KEY:-}"
    volumes:
      # Saved model versions survive a restart, so a demo can be prepared ahead
      # of time.
      - ./versions:/app/versions
    restart: unless-stopped
